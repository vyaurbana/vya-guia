# Hace la guía de programación (guia.json) sola, cada 4 horas
name: Hacer la guía
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  guia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hacer guia.json
        run: python hacer_guia.py
      - name: Guardar si ha cambiado
        run: |
          git config user.name "VYA guía"
          git config user.email "salamanca@vyaurbana.com"
          # Siempre un solo «commit» (así el almacén no crece con las guías viejas)
          git checkout --orphan nueva
          git add -A
          git commit -q -m "Guía actualizada"
          git push -f origin nueva:main
